name: schedule-heartbeat

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  scheduler-heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Record scheduler evidence
        shell: bash
        run: |
          echo '{"event_name":"'"$GITHUB_EVENT_NAME"'","run_id":"'"$GITHUB_RUN_ID"'","workflow":"schedule-heartbeat"}' > schedule-heartbeat-evidence.json
      - name: Detect stalled self-hosted execution
        id: runner_watchdog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow autonomous-model-scout.yml --limit 20 --json databaseId,status,createdAt,url > autonomous-runs.json
          python - <<'PY'
          import datetime,json,pathlib
          runs=json.loads(pathlib.Path('autonomous-runs.json').read_text())
          now=datetime.datetime.now(datetime.timezone.utc)
          stalled=[]
          for run in runs:
              if run['status'] != 'queued':
                  continue
              created=datetime.datetime.fromisoformat(run['createdAt'].replace('Z','+00:00'))
              age=(now-created).total_seconds()
              if age >= 1200:
                  stalled.append({**run,'queued_seconds':round(age)})
          evidence={'status':'PASS' if not stalled else 'FAIL_SELF_HOSTED_RUNNER_STALLED','checked_at':now.isoformat(),'stalled_runs':stalled}
          pathlib.Path('runner-health-evidence.json').write_text(json.dumps(evidence,indent=2))
          if stalled:
              raise SystemExit('self-hosted MODEL SCOUT run has remained queued for at least 20 minutes')
          PY
      - name: Upload scheduler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schedule-heartbeat-evidence
          path: |
            schedule-heartbeat-evidence.json
            runner-health-evidence.json
            autonomous-runs.json
