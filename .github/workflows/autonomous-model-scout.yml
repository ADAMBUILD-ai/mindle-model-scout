name: autonomous-model-scout

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: model-scout-autonomous-cycle
  cancel-in-progress: false

jobs:
  recovery-cycle:
    # Scheduled recovery requires a runner-mounted durable state directory. GitHub-hosted
    # workspaces are intentionally not used as a queue SSOT because they are ephemeral.
    runs-on: [self-hosted, model-scout]
    timeout-minutes: 30
    env:
      MODEL_SCOUT_CONFIGURED_REPOS: ${{ vars.MODEL_SCOUT_CONFIGURED_REPOS }}
      MODEL_SCOUT_STATE_DIR: ${{ vars.MODEL_SCOUT_STATE_DIR }}
      MODEL_SCOUT_STALE_AFTER_SECONDS: '1800'
      MODEL_SCOUT_LIMIT: '10'
      GITHUB_TOKEN: ${{ secrets.MODEL_SCOUT_CROSS_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Python runtime
        shell: pwsh
        run: |
          if (Get-Command py -ErrorAction SilentlyContinue) {
            py -3 --version
          } elseif (Get-Command python -ErrorAction SilentlyContinue) {
            python --version
          } else {
            throw 'Python 3 runtime is not installed'
          }
      - name: Install Python dependencies
        shell: pwsh
        run: |
          if (Get-Command py -ErrorAction SilentlyContinue) {
            py -3 -m pip install -r requirements.txt
          } else {
            python -m pip install -r requirements.txt
          }
      - name: Verify autonomous-runner prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:MODEL_SCOUT_CONFIGURED_REPOS) { throw 'MODEL_SCOUT_CONFIGURED_REPOS is empty' }
          if (-not $env:MODEL_SCOUT_STATE_DIR) { throw 'MODEL_SCOUT_STATE_DIR is empty' }
          if (-not $env:GITHUB_TOKEN) { throw 'MODEL_SCOUT_CROSS_REPO_TOKEN is empty' }
          if (-not (Test-Path $env:MODEL_SCOUT_STATE_DIR)) {
            New-Item -ItemType Directory -Path $env:MODEL_SCOUT_STATE_DIR | Out-Null
          }
      - name: Recover stale work and execute queued requests
        shell: pwsh
        run: |
          $python = if (Get-Command py -ErrorAction SilentlyContinue) { 'py' } else { 'python' }
          if ($python -eq 'py') {
            & py -3 scripts/run_autonomous_cycle.py | Tee-Object autonomous-cycle-evidence.json
          } else {
            & python scripts/run_autonomous_cycle.py | Tee-Object autonomous-cycle-evidence.json
          }
      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-scout-autonomous-evidence
          path: autonomous-cycle-evidence.json
