name: autonomous-model-scout

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: model-scout-autonomous-cycle
  cancel-in-progress: false

jobs:
  recovery-cycle:
    # Scheduled recovery requires a runner-mounted durable state directory. GitHub-hosted
    # workspaces are intentionally not used as a queue SSOT because they are ephemeral.
    runs-on: [self-hosted, model-scout]
    timeout-minutes: 30
    env:
      MODEL_SCOUT_CONFIGURED_REPOS: ${{ vars.MODEL_SCOUT_CONFIGURED_REPOS }}
      MODEL_SCOUT_STATE_DIR: ${{ vars.MODEL_SCOUT_STATE_DIR }}
      MODEL_SCOUT_STALE_AFTER_SECONDS: '1800'
      MODEL_SCOUT_LIMIT: '10'
      GITHUB_TOKEN: ${{ secrets.MODEL_SCOUT_CROSS_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Python runtime
        shell: bash
        run: python --version
      - run: python -m pip install -r requirements.txt
      - name: Verify autonomous-runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MODEL_SCOUT_CONFIGURED_REPOS"
          test -n "$MODEL_SCOUT_STATE_DIR"
          test -n "$GITHUB_TOKEN"
          test -d "$MODEL_SCOUT_STATE_DIR" || mkdir -p "$MODEL_SCOUT_STATE_DIR"
      - name: Recover stale work and execute queued requests
        shell: bash
        run: PYTHONPATH=. python scripts/run_autonomous_cycle.py | tee autonomous-cycle-evidence.json
      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-scout-autonomous-evidence
          path: autonomous-cycle-evidence.json
