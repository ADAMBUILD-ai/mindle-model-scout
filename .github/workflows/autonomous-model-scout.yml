name: autonomous-model-scout

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/autonomous-model-scout.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: model-scout-autonomous-cycle
  cancel-in-progress: false

jobs:
  recovery-cycle:
    # Scheduled recovery requires a runner-mounted durable state directory. GitHub-hosted
    # workspaces are intentionally not used as a queue SSOT because they are ephemeral.
    runs-on: [self-hosted, model-scout]
    timeout-minutes: 30
    env:
      MODEL_SCOUT_CONFIGURED_REPOS: ${{ vars.MODEL_SCOUT_CONFIGURED_REPOS }}
      MODEL_SCOUT_STATE_DIR: ${{ vars.MODEL_SCOUT_STATE_DIR }}
      MODEL_SCOUT_STALE_AFTER_SECONDS: '1800'
      MODEL_SCOUT_LIMIT: '10'
      GITHUB_TOKEN: ${{ secrets.MODEL_SCOUT_CROSS_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Discover or bootstrap Python runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          function Find-Python3 {
            $candidates = @()
            foreach ($name in @('python.exe', 'python')) {
              $cmd = Get-Command $name -ErrorAction SilentlyContinue
              if ($cmd -and $cmd.Source) { $candidates += $cmd.Source }
            }
            foreach ($pattern in @(
              'C:\Python3*\python.exe',
              'C:\Program Files\Python3*\python.exe',
              'C:\Program Files (x86)\Python3*\python.exe',
              'C:\Users\*\AppData\Local\Programs\Python\Python3*\python.exe',
              'C:\actions-runner\_work\_tool\Python\3.*\x64\python.exe',
              'C:\actions-runner\_work\_tool\portable-python-3.11.9\**\python.exe'
            )) {
              $candidates += Get-ChildItem -Path $pattern -File -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            }
            foreach ($candidate in ($candidates | Select-Object -Unique)) {
              if (-not (Test-Path -LiteralPath $candidate)) { continue }
              try {
                $version = & $candidate --version 2>&1
                if ($LASTEXITCODE -eq 0 -and "$version" -match '^Python 3\.') {
                  Write-Host "Using Python runtime: $candidate ($version)"
                  return $candidate
                }
              } catch {
                Write-Host "Rejected Python candidate: $candidate :: $($_.Exception.Message)"
              }
            }
            return $null
          }

          $python = Find-Python3
          if (-not $python) {
            $bootstrapRoot = 'C:\actions-runner\_work\_tool\portable-python-3.11.9'
            $archive = Join-Path $env:RUNNER_TEMP 'python-3.11.9-win32-x64.zip'
            if (Test-Path -LiteralPath $bootstrapRoot) {
              Remove-Item -LiteralPath $bootstrapRoot -Recurse -Force -ErrorAction SilentlyContinue
            }
            New-Item -ItemType Directory -Path $bootstrapRoot -Force | Out-Null
            Write-Host 'No service-account Python found; bootstrapping runner-local Python 3.11.9 without registry installation.'
            Invoke-WebRequest -Uri 'https://github.com/actions/python-versions/releases/download/3.11.9-9947079978/python-3.11.9-win32-x64.zip' -OutFile $archive
            Expand-Archive -LiteralPath $archive -DestinationPath $bootstrapRoot -Force

            $pythonCandidates = Get-ChildItem -LiteralPath $bootstrapRoot -Filter python.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            foreach ($candidate in $pythonCandidates) {
              try {
                $version = & $candidate --version 2>&1
                if ($LASTEXITCODE -eq 0 -and "$version" -match '^Python 3\.') {
                  $python = $candidate
                  Write-Host "Bootstrapped Python runtime: $python ($version)"
                  break
                }
              } catch {
                Write-Host "Rejected bootstrapped Python candidate: $candidate :: $($_.Exception.Message)"
              }
            }
          }

          if (-not $python) {
            throw 'No executable Python 3 runtime is reachable or bootstrap-capable for the GitHub Actions service account.'
          }

          "PYTHON_EXE=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify Python runtime and pip
        shell: powershell
        run: |
          & $env:PYTHON_EXE --version
          & $env:PYTHON_EXE -m pip --version
          if ($LASTEXITCODE -ne 0) {
            & $env:PYTHON_EXE -m ensurepip --upgrade
          }
          & $env:PYTHON_EXE -m pip --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Python dependencies
        shell: powershell
        run: '& $env:PYTHON_EXE -m pip install -r requirements.txt'

      - name: Verify autonomous-runner prerequisites
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:MODEL_SCOUT_CONFIGURED_REPOS) { throw 'MODEL_SCOUT_CONFIGURED_REPOS is empty' }
          if (-not $env:MODEL_SCOUT_STATE_DIR) { throw 'MODEL_SCOUT_STATE_DIR is empty' }
          if (-not $env:GITHUB_TOKEN) { throw 'MODEL_SCOUT_CROSS_REPO_TOKEN is empty' }
          if (-not (Test-Path -LiteralPath $env:MODEL_SCOUT_STATE_DIR)) {
            New-Item -ItemType Directory -Path $env:MODEL_SCOUT_STATE_DIR -Force | Out-Null
          }
          $probe = Join-Path $env:MODEL_SCOUT_STATE_DIR '.runner-write-probe'
          'ok' | Set-Content -LiteralPath $probe -Encoding ascii
          Remove-Item -LiteralPath $probe -Force

      - name: Recover stale work and execute queued requests
        shell: powershell
        run: |
          $env:PYTHONPATH='.'
          & $env:PYTHON_EXE scripts/run_autonomous_cycle.py | Tee-Object -FilePath autonomous-cycle-evidence.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-scout-autonomous-evidence
          path: autonomous-cycle-evidence.json
