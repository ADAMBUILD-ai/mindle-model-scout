# scheduler registration refresh
name: autonomous-model-scout

on:
  issues:
    types: [opened, edited, reopened, labeled]
  repository_dispatch:
    types: [model-scout-request]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/autonomous-model-scout.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: model-scout-autonomous-${{ github.event.issue.number || github.event.client_payload.request_fingerprint || 'watchdog' }}
  cancel-in-progress: false

jobs:
  recovery-cycle:
    runs-on: [self-hosted, model-scout]
    timeout-minutes: 30
    env:
      MODEL_SCOUT_CONFIGURED_REPOS: ${{ vars.MODEL_SCOUT_CONFIGURED_REPOS || 'ADAMBUILD-ai/mindle-model-scout,ADAMBUILD-ai/adam-build,ADAMBUILD-ai/avora-engine,ADAMBUILD-ai/aura-engine,ADAMBUILD-ai/axiom-engine,ADAMBUILD-ai/agri-ai-business-platform,ADAMBUILD-ai/mindle-media-ai,ADAMBUILD-ai/kimserv-core,ADAMBUILD-ai/arcos-engine' }}
      MODEL_SCOUT_STATE_DIR: 'C:\actions-runner\_work\_state\mindle-model-scout'
      MODEL_SCOUT_STALE_AFTER_SECONDS: '1800'
      MODEL_SCOUT_LIMIT: '10'
      MODEL_SCOUT_ACQUISITION_CONCURRENCY: '3'
      MODEL_SCOUT_MAX_REQUESTS_PER_CYCLE: '4'
      MODEL_SCOUT_MAX_RETRIES: '3'
      MODEL_SCOUT_RETRY_BACKOFF_SECONDS: '900'
      MODEL_SCOUT_EXECUTOR_CONFIG: 'config/runtime-executors.json'
      MODEL_SCOUT_TEAM_REGISTRY: 'config/team-registry.json'
      MODEL_SCOUT_LOCAL_GITHUB_TOKEN: ${{ github.token }}
      MODEL_SCOUT_CROSS_REPO_TOKEN: ${{ secrets.MODEL_SCOUT_CROSS_REPO_TOKEN }}
      MODEL_SCOUT_EVENT_REPOSITORY: ${{ github.repository }}
      MODEL_SCOUT_EVENT_ISSUE: ${{ github.event.issue.number }}
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@v4

      - name: Discover or install runner-local Python runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $runtimeRoot = 'C:\actions-runner\_work\_tool\python311-service'
          $preferredPython = Join-Path $runtimeRoot 'python.exe'
          function Test-Python3([string]$candidate) {
            if (-not $candidate -or -not (Test-Path -LiteralPath $candidate)) { return $false }
            try {
              $version = & $candidate --version 2>&1
              if ($LASTEXITCODE -eq 0 -and "$version" -match '^Python 3\.') {
                Write-Host "Using Python runtime: $candidate ($version)"
                return $true
              }
            } catch { Write-Host "Rejected Python candidate: $candidate :: $($_.Exception.Message)" }
            return $false
          }
          $python = $null
          if (Test-Python3 $preferredPython) { $python = $preferredPython }
          if (-not $python) {
            $candidates = @()
            foreach ($name in @('python.exe', 'python')) {
              $cmd = Get-Command $name -ErrorAction SilentlyContinue
              if ($cmd -and $cmd.Source) { $candidates += $cmd.Source }
            }
            foreach ($pattern in @('C:\Python3*\python.exe','C:\Program Files\Python3*\python.exe','C:\Program Files (x86)\Python3*\python.exe','C:\Users\*\AppData\Local\Programs\Python\Python3*\python.exe','C:\actions-runner\_work\_tool\Python\3.*\x64\python.exe')) {
              $candidates += Get-ChildItem -Path $pattern -File -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            }
            foreach ($candidate in ($candidates | Select-Object -Unique)) { if (Test-Python3 $candidate) { $python = $candidate; break } }
          }
          if (-not $python) {
            New-Item -ItemType Directory -Path $runtimeRoot -Force | Out-Null
            $archive = Join-Path $env:RUNNER_TEMP 'python-3.11.9-embed-amd64.zip'
            Invoke-WebRequest -Uri 'https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip' -OutFile $archive
            Expand-Archive -LiteralPath $archive -DestinationPath $runtimeRoot -Force
            if (-not (Test-Python3 $preferredPython)) { throw 'Runner-local embedded Python extraction completed but python.exe is not executable by the service account.' }
            $python = $preferredPython
          }
          "PYTHON_EXE=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify Python runtime and pip
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:PYTHON_EXE --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pythonRoot = Split-Path -Parent $env:PYTHON_EXE
          $pth = Join-Path $pythonRoot 'python311._pth'
          if (Test-Path -LiteralPath $pth) {
            $lines = @(Get-Content -LiteralPath $pth)
            $lines = @($lines | ForEach-Object { if ($_ -eq '#import site') { 'import site' } else { $_ } })
            if ($lines -notcontains 'Lib\site-packages') { $lines += 'Lib\site-packages' }
            Set-Content -LiteralPath $pth -Value $lines -Encoding ascii
          }
          & $env:PYTHON_EXE -m pip --version
          if ($LASTEXITCODE -ne 0) {
            $getPip = Join-Path $env:RUNNER_TEMP 'get-pip.py'
            Invoke-WebRequest -Uri 'https://bootstrap.pypa.io/get-pip.py' -OutFile $getPip
            & $env:PYTHON_EXE $getPip --disable-pip-version-check --no-warn-script-location
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $env:PYTHON_EXE -m pip --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Cache runner dependencies
        uses: actions/cache@v4
        with:
          path: C:\actions-runner\_work\_tool\model-scout-pip-cache
          key: model-scout-pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install changed Python dependencies only
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $cache = 'C:\actions-runner\_work\_tool\model-scout-pip-cache'
          New-Item -ItemType Directory -Path $cache -Force | Out-Null
          $fingerprint = (Get-FileHash -Algorithm SHA256 requirements.txt).Hash
          $marker = Join-Path $cache "$fingerprint.ok"
          if (-not (Test-Path -LiteralPath $marker)) {
            & $env:PYTHON_EXE -m pip install --cache-dir $cache -r requirements.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $fingerprint | Set-Content -LiteralPath $marker -Encoding ascii
          } else {
            Write-Host "Dependency fingerprint cache hit: $fingerprint"
          }

      - name: Verify autonomous-runner prerequisites
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:MODEL_SCOUT_CONFIGURED_REPOS) { throw 'MODEL_SCOUT_CONFIGURED_REPOS is empty' }
          if (-not $env:MODEL_SCOUT_LOCAL_GITHUB_TOKEN) { throw 'MODEL_SCOUT_LOCAL_GITHUB_TOKEN is empty' }
          if (-not $env:MODEL_SCOUT_CROSS_REPO_TOKEN) { throw 'MODEL_SCOUT_CROSS_REPO_TOKEN is empty' }
          $stateDir = 'C:\actions-runner\_work\_state\mindle-model-scout'
          New-Item -ItemType Directory -Path $stateDir -Force | Out-Null
          $probe = Join-Path $stateDir '.runner-write-probe'
          'ok' | Set-Content -LiteralPath $probe -Encoding ascii
          Remove-Item -LiteralPath $probe -Force
          $markerPath = Join-Path $stateDir '.model-scout-persistence-marker'
          if (-not (Test-Path -LiteralPath $markerPath)) { [guid]::NewGuid().Guid | Set-Content -LiteralPath $markerPath -Encoding ascii }
          $marker = (Get-Content -LiteralPath $markerPath -Raw).Trim()
          "MODEL_SCOUT_STATE_DIR=$stateDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MODEL_SCOUT_STATE_DIR_MODE=canonical_runner_owned" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MODEL_SCOUT_STATE_MARKER=$marker" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Canonical durable state: $stateDir"
          Write-Host "Persistence marker: $marker"

      - name: Recover stale work and execute queued requests
        shell: powershell
        run: |
          $repoRoot = (Get-Location).Path
          $runnerCode = "import sys,runpy; sys.path.insert(0, r'$repoRoot'); runpy.run_path(r'scripts/run_autonomous_cycle.py', run_name='__main__')"
          & $env:PYTHON_EXE -c $runnerCode | Tee-Object -FilePath autonomous-cycle-evidence.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Add canonical execution metadata
        shell: powershell
        run: |
          $cycle = Get-Content -LiteralPath autonomous-cycle-evidence.json -Raw | ConvertFrom-Json
          [ordered]@{
            state_dir = $env:MODEL_SCOUT_STATE_DIR
            state_dir_mode = $env:MODEL_SCOUT_STATE_DIR_MODE
            persistence_marker = $env:MODEL_SCOUT_STATE_MARKER
            runner_name = $env:RUNNER_NAME
            run_id = $env:GITHUB_RUN_ID
            event_name = $env:GITHUB_EVENT_NAME
            queue = $cycle.queue
            results = $cycle.results
            watchdog_requeued = $cycle.watchdog_requeued
          } | ConvertTo-Json -Depth 30 | Set-Content -LiteralPath autonomous-cycle-evidence.json -Encoding utf8

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-scout-autonomous-evidence
          path: autonomous-cycle-evidence.json
      - name: Upload live model registry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-scout-live-registry
          path: C:\actions-runner\_work\_state\mindle-model-scout\model-registry.json
          if-no-files-found: warn
