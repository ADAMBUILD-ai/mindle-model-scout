name: apply autonomous production fix

on:
  push:
    branches: [fix/model-scout-autonomous-production-20260924]
    paths: [autonomous-production-fix.patch]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/model-scout-autonomous-production-20260924
      - name: Apply verified local commit patch
        run: |
          git apply --check autonomous-production-fix.patch
          git apply autonomous-production-fix.patch
          git rm autonomous-production-fix.patch .github/workflows/apply-autonomous-production-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: complete autonomous model acquisition pipeline"
          git push origin HEAD:fix/model-scout-autonomous-production-20260924
