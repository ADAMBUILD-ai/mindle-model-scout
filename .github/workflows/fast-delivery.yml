name: model-scout-fast-delivery

on:
  push:
    branches: [recovery/autonomous-execution-20260916]
    paths:
      - 'scripts/run_fast_delivery.py'
      - 'scripts/post_fast_delivery_callback.py'
      - 'src/model_scout/delivery_ledger.py'
      - '.github/workflows/fast-delivery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deliver-safe-public-model:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.MODEL_SCOUT_CROSS_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "transformers==4.57.3" "huggingface_hub==0.36.2" safetensors
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Execute degraded-autonomy FAST DELIVERY
        run: PYTHONPATH=. python scripts/run_fast_delivery.py
      - name: Callback delivered evidence to AGRI
        run: PYTHONPATH=. python scripts/post_fast_delivery_callback.py
      - name: Upload FAST DELIVERY evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-scout-fast-delivery-evidence
          path: |
            fast-delivery-evidence.json
            fast-delivery-korean-embedding.json
            fast-delivery-callback.json
            fast-delivery-ledger.sqlite3
          if-no-files-found: warn
