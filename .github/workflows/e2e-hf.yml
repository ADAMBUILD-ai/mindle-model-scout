name: hf-e2e
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  live-huggingface-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run live Hugging Face E2E smoke tests
        run: python -m pytest -q tests/test_hf_e2e.py tests/test_api_hf_e2e.py
      - name: Record required MODEL SCOUT search sequence
        run: python scripts/run_live_model_scout_sequence.py
      - name: Download and verify SAM 2.1 safe weight
        run: python scripts/run_sam21_mission.py
      - name: Upload MODEL SCOUT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-scout-evidence
          path: |
            model-scout-search-evidence.json
            sam21-mission-evidence.json
          if-no-files-found: error
