name: hf-e2e

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  live-huggingface-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Run live Hugging Face E2E smoke tests
        run: python -m pytest -q tests/test_hf_e2e.py
