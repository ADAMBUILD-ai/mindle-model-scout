name: hf-e2e
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  live-huggingface-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test, ONNX, and SAM 2.1 inference runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest onnx pillow
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
      - name: Run live Hugging Face E2E smoke tests
        run: python -m pytest -q tests/test_hf_e2e.py tests/test_api_hf_e2e.py
      - name: Record required MODEL SCOUT search sequence
        run: python scripts/run_live_model_scout_sequence.py
      - name: Download and validate SAM 2.1 safe weight
        run: python scripts/run_sam21_mission.py
      - name: Run SAM 2.1 image segmentation smoke
        run: python scripts/run_sam21_inference.py
      - name: Run Team Router exact head evidence
        env:
          GITHUB_TOKEN: ${{ secrets.MODEL_SCOUT_CROSS_REPO_TOKEN }}
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "MODEL_SCOUT_CROSS_REPO_TOKEN is unavailable; cannot verify Team Router exact-head route."
            exit 1
          fi
          python scripts/route_team_requests.py --state-dir team-router-state

      - name: Upload MODEL SCOUT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-scout-evidence
          path: |
            model-scout-search-evidence.json
            sam21-mission-evidence.json
            sam21-inference-evidence.json
            sam21-input.jpg
            sam21-mask.png
            team-router-state/team-router-evidence.json
          if-no-files-found: error
