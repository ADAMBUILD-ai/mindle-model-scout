name: live-throughput-closeout

on:
  push:
    branches: [improvement/model-scout-throughput-20260923]
    paths:
      - '.github/workflows/live-throughput-closeout.yml'
      - 'scripts/prepare_live_acquisition_specs.py'
      - 'scripts/finalize_live_acquisition_evidence.py'
      - 'scripts/run_parallel_acquisition.py'
      - 'src/model_scout/acquisition.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: model-scout-live-throughput-closeout
  cancel-in-progress: false

jobs:
  acquire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improvement/model-scout-throughput-20260923

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve demand-backed candidates at exact revisions
        run: python scripts/prepare_live_acquisition_specs.py

      - name: Acquire three real models concurrently
        run: python scripts/run_parallel_acquisition.py live-acquisition-specs.json --state-dir live-state --concurrency 3 --output live-acquisition-first.json

      - name: Prove cache and registry idempotency
        run: python scripts/run_parallel_acquisition.py live-acquisition-specs.json --state-dir live-state --concurrency 3 --output live-acquisition-rerun.json

      - name: Build sanitized evidence exports
        run: python scripts/finalize_live_acquisition_evidence.py

      - name: Commit exact live acquisition evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add evidence/model-registry.json evidence/live-candidate-selection-20260923.json evidence/parallel-acquisition-evidence-20260923.json evidence/acquisition-validation-isolation-20260923.json evidence/throughput-idempotency-20260923.json evidence/throughput-benchmark-20260923.json
          git commit -m "evidence: record live parallel model acquisition"
          git push origin HEAD:improvement/model-scout-throughput-20260923

      - name: Upload raw acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-throughput-acquisition
          path: |
            live-acquisition-specs.json
            live-acquisition-first.json
            live-acquisition-rerun.json
            evidence/*.json
          if-no-files-found: error
