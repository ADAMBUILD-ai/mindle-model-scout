name: AURA v43 pinned model recovery
on:
  push:
    branches: [recovery/aura-v43-materialization-20260923]
    paths: ['.github/workflows/aura-v43-recovery.yml', 'scripts/materialize_aura_v43_public_models.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aura-v43-model-recovery
  cancel-in-progress: false
jobs:
  recover-public-model-bytes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install huggingface_hub==0.34.4
      - name: Recover exact public bytes and retain unpublished bundles
        env:
          GH_TOKEN: ${{ github.token }}
          HF_HUB_DISABLE_PROGRESS_BARS: '1'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python scripts/materialize_aura_v43_public_models.py
