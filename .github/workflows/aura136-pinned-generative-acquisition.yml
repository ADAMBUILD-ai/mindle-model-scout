name: aura136-pinned-generative-acquisition
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: model-scout-autonomous
  cancel-in-progress: false
jobs:
  readonly-existing-asset-preflight:
    runs-on: [self-hosted, model-scout]
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen AURA scripts and existing files without inference
        shell: powershell
        run: |
          if ((Get-FileHash scripts/aura_136_existing_asset_preflight.py -Algorithm SHA256).Hash.ToLower() -ne 'fde48a50826e5a81b2d8e3364820f11a44abb517910433c4015620a4383db414') { throw 'preflight source hash mismatch' }
          if ((Get-FileHash scripts/run_aura_136_local_benchmark.py -Algorithm SHA256).Hash.ToLower() -ne '4c3f12e52d1781e99f55fdbf5c84b0c1465b3fca0f5cdd05495f5c7f88aca944') { throw 'benchmark helper source hash mismatch' }
          & 'C:\actions-runner\_work\_tool\python311-service\python.exe' scripts/run_aura136_readonly_bridge.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aura136-existing-asset-readonly-preflight
          path: aura136-existing-asset-preflight-*.json
          if-no-files-found: error
          retention-days: 90
